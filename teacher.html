<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DreamTeach — O'qituvchi paneli</title>
<meta name="description" content="DreamTeach o'qituvchi paneli — ro'yxatdan o'ting, AI imtihonidan o'ting va kurs yuklang.">
<meta name="theme-color" content="#0a1628">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a1628;
  --bg2: #0f1f3d;
  --bg3: #152848;
  --card: rgba(255,255,255,0.05);
  --border: rgba(255,255,255,0.1);
  --accent: #6c63ff;
  --accent2: #00e5ff;
  --green: #00ff94;
  --red: #ff4f6a;
  --yellow: #ffd700;
  --text: #e8eaf6;
  --muted: #8892a4;
  --radius: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); }
body { min-height: 100vh; display: flex; flex-direction: column; }

/* BG gradient */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: -1;
  background: radial-gradient(ellipse 80% 60% at 20% 10%, rgba(108,99,255,.18) 0%, transparent 60%),
              radial-gradient(ellipse 60% 50% at 80% 80%, rgba(0,229,255,.12) 0%, transparent 60%),
              var(--bg);
}

/* Layout */
.page-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 24px 16px 48px;
  min-height: 100vh;
}
.logo-row {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 36px; align-self: flex-start;
}
.logo-mark {
  width: 44px; height: 44px; border-radius: 12px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 800; color: #fff;
  box-shadow: 0 4px 20px rgba(108,99,255,.4);
}
.logo-name { font-size: 22px; font-weight: 700; }
.logo-name span { color: var(--accent2); }

/* Panel container */
.panel {
  width: 100%; max-width: 560px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 36px 32px;
  backdrop-filter: blur(20px);
  box-shadow: 0 20px 60px rgba(0,0,0,.4);
}
@media (max-width: 600px) { .panel { padding: 24px 20px; } }

.panel-title {
  font-size: 24px; font-weight: 700; margin-bottom: 6px;
}
.panel-sub { color: var(--muted); font-size: 14px; margin-bottom: 28px; }

/* Steps indicator */
.steps {
  display: flex; gap: 8px; margin-bottom: 32px;
}
.step-dot {
  flex: 1; height: 4px; border-radius: 999px;
  background: var(--border); transition: background .3s;
}
.step-dot.done { background: var(--accent); }
.step-dot.active { background: var(--accent2); }

/* Form */
.f-group { margin-bottom: 20px; }
.f-label {
  display: block; font-size: 13px; font-weight: 600;
  color: var(--muted); margin-bottom: 8px; letter-spacing: .02em;
  text-transform: uppercase;
}
.f-input, .f-textarea, .f-select {
  width: 100%; padding: 13px 16px;
  background: rgba(255,255,255,0.06); border: 1px solid var(--border);
  border-radius: 12px; color: var(--text); font-size: 15px;
  font-family: inherit; outline: none; transition: border .2s, background .2s;
  -webkit-appearance: none;
}
.f-input:focus, .f-textarea:focus, .f-select:focus {
  border-color: var(--accent); background: rgba(108,99,255,.08);
}
.f-textarea { resize: vertical; min-height: 120px; }
.f-select option { background: #1a2a4a; }
.f-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 480px) { .f-row { grid-template-columns: 1fr; } }

/* Buttons */
.btn-primary {
  width: 100%; padding: 15px; border-radius: 14px; border: none;
  background: linear-gradient(135deg, var(--accent), #9b6cff);
  color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
  box-shadow: 0 4px 24px rgba(108,99,255,.5);
  transition: transform .15s, box-shadow .15s, opacity .15s;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(108,99,255,.6); }
.btn-primary:active:not(:disabled) { transform: translateY(0); }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }
.btn-ghost {
  padding: 10px 20px; border-radius: 10px; border: 1px solid var(--border);
  background: transparent; color: var(--muted); font-size: 14px; cursor: pointer;
  transition: all .2s;
}
.btn-ghost:hover { border-color: var(--accent); color: var(--text); }

/* AI Analysis card */
.ai-card {
  border-radius: 16px; padding: 20px;
  margin: 20px 0; border: 1px solid var(--border);
  background: rgba(255,255,255,0.03);
}
.ai-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.ai-label {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
}
.ai-label.ok { background: rgba(0,255,148,.12); color: var(--green); }
.ai-label.warn { background: rgba(255,79,106,.12); color: var(--red); }
.ai-label.info { background: rgba(108,99,255,.15); color: var(--accent2); }

.score-ring {
  width: 80px; height: 80px; border-radius: 50%;
  background: conic-gradient(var(--accent) var(--pct), rgba(255,255,255,0.1) 0);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 16px;
  position: relative;
}
.score-ring::before {
  content: ''; position: absolute; inset: 8px;
  border-radius: 50%; background: var(--bg2);
}
.score-val { position: relative; z-index: 1; font-size: 22px; font-weight: 800; }

.tag-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.tag {
  padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 500;
  background: rgba(0,255,148,.1); color: var(--green); border: 1px solid rgba(0,255,148,.2);
}
.tag.bad { background: rgba(255,79,106,.1); color: var(--red); border-color: rgba(255,79,106,.2); }

/* ===== EXAM — full redesign ===== */
.exam-outer {
  width: 100%; max-width: 640px;
  display: flex; flex-direction: column; gap: 0;
}

/* Top bar */
.exam-topbar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px; gap: 12px; flex-wrap: wrap;
}
.exam-progress-label {
  font-size: 13px; font-weight: 600; color: var(--muted);
}
.exam-timer {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 14px; border-radius: 999px;
  background: rgba(255,255,255,.05); border: 1px solid var(--border);
  font-size: 13px; font-weight: 700; min-width: 80px; justify-content: center;
  transition: color .3s, border-color .3s;
}
.exam-timer.urgent { color: var(--red); border-color: rgba(255,79,106,.4); background: rgba(255,79,106,.07); }

/* Progress dots */
.exam-dots {
  display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap;
}
.exam-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: rgba(255,255,255,.12); border: 1.5px solid rgba(255,255,255,.12);
  transition: all .25s;
}
.exam-dot.answered { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 6px rgba(108,99,255,.5); }
.exam-dot.current  { background: var(--accent2); border-color: var(--accent2); transform: scale(1.3); }

/* Progress bar */
.exam-pbar {
  height: 5px; border-radius: 999px; background: rgba(255,255,255,.07);
  margin-bottom: 28px; overflow: hidden; position: relative;
}
.exam-pbar-fill {
  height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  transition: width .4s cubic-bezier(.4,0,.2,1);
}
.exam-pbar-time {
  position: absolute; top: 0; right: 0; height: 100%;
  background: linear-gradient(90deg, var(--red), var(--yellow));
  border-radius: 999px; transition: width .9s linear, opacity .3s;
}

/* Question card */
.q-card {
  background: linear-gradient(135deg, rgba(108,99,255,.07) 0%, rgba(0,229,255,.04) 100%);
  border: 1px solid rgba(108,99,255,.2);
  border-radius: 20px; padding: 28px 24px 24px;
  margin-bottom: 16px;
  animation: fadeUp .3s ease both;
  box-shadow: 0 4px 24px rgba(0,0,0,.2);
}
.q-num {
  font-size: 11px; font-weight: 800; color: var(--accent2);
  text-transform: uppercase; letter-spacing: .1em; margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.q-num::before {
  content: ''; display: inline-block; width: 20px; height: 2px;
  background: var(--accent2); border-radius: 999px;
}
.q-text {
  font-size: 17px; font-weight: 700; margin-bottom: 20px;
  line-height: 1.55; color: var(--text);
}
.q-opts { display: flex; flex-direction: column; gap: 10px; }
.q-opt {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 18px; border-radius: 14px;
  border: 1.5px solid rgba(255,255,255,.08); cursor: pointer;
  background: rgba(255,255,255,.03); color: var(--text); font-size: 15px;
  font-family: inherit; text-align: left;
  transition: all .18s cubic-bezier(.4,0,.2,1);
  position: relative; overflow: hidden;
}
.q-opt::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(108,99,255,.12), rgba(0,229,255,.06));
  opacity: 0; transition: opacity .2s;
}
.q-opt:hover { border-color: rgba(108,99,255,.5); transform: translateX(4px); }
.q-opt:hover::before { opacity: 1; }
.q-opt.sel {
  border-color: var(--accent); background: rgba(108,99,255,.12);
  transform: translateX(6px);
  box-shadow: 0 0 0 1px var(--accent), 0 4px 16px rgba(108,99,255,.2);
}
.q-opt.sel::before { opacity: 1; }
.q-opt.sel .opt-key { background: var(--accent); border-color: var(--accent); color: #fff; }
.q-opt.right { border-color: var(--green); background: rgba(0,255,148,.08); color: var(--green); transform: none; }
.q-opt.right .opt-key { background: var(--green); border-color: var(--green); color: #000; }
.q-opt.wrong { border-color: var(--red); background: rgba(255,79,106,.08); color: var(--red); transform: none; }
.q-opt.wrong .opt-key { background: var(--red); border-color: var(--red); color: #fff; }
.q-opt.disabled { cursor: not-allowed; opacity: .6; transform: none !important; }
.opt-key {
  width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800; letter-spacing: 0;
  background: rgba(255,255,255,.07); border: 1.5px solid rgba(255,255,255,.12);
  transition: all .18s; position: relative; z-index: 1;
}
.opt-label { position: relative; z-index: 1; }

/* Exam wrap */
.exam-wrap { display: flex; flex-direction: column; }

/* Timer bar (legacy, hidden) */
.timer-bar { display: none; }
.timer-fill { display: none; }

/* Status screen */
.status-icon {
  width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 20px;
  display: flex; align-items: center; justify-content: center;
  font-size: 36px;
}
.status-icon.pending { background: rgba(255,215,0,.1); border: 2px solid rgba(255,215,0,.3); }
.status-icon.approved { background: rgba(0,255,148,.1); border: 2px solid rgba(0,255,148,.3); }
.status-icon.rejected { background: rgba(255,79,106,.1); border: 2px solid rgba(255,79,106,.3); }

/* Dashboard */
.db-kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 24px; }
.db-kpi {
  background: rgba(255,255,255,.04); border: 1px solid var(--border);
  border-radius: 14px; padding: 16px;
}
.db-kpi .v { font-size: 26px; font-weight: 800; display: block; margin-bottom: 2px; }
.db-kpi .l { font-size: 12px; color: var(--muted); font-weight: 500; }
.db-kpi.c-purple .v { color: var(--accent); }
.db-kpi.c-cyan .v { color: var(--accent2); }
.db-kpi.c-green .v { color: var(--green); }
.db-kpi.c-yellow .v { color: var(--yellow); }

.section-title {
  font-size: 16px; font-weight: 700; margin-bottom: 14px;
  display: flex; align-items: center; gap: 8px;
}

.lesson-card {
  background: rgba(255,255,255,.03); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; margin-bottom: 10px;
}
.lesson-card .l-info .nm { font-weight: 600; font-size: 15px; }
.lesson-card .l-info .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
}
.chip.ok { background: rgba(0,255,148,.1); color: var(--green); }
.chip.warn { background: rgba(255,215,0,.1); color: var(--yellow); }
.chip.info { background: rgba(108,99,255,.12); color: var(--accent2); }

/* Publish form */
.pub-form { display: flex; flex-direction: column; gap: 16px; }
.pub-form .f-group { margin-bottom: 0; }

/* Error */
.err-msg { color: var(--red); font-size: 13px; margin-top: 8px; min-height: 20px; }
.ok-msg { color: var(--green); font-size: 13px; margin-top: 8px; }

/* Spinner */
.spin {
  display: inline-block; width: 20px; height: 20px; border-radius: 50%;
  border: 2.5px solid rgba(255,255,255,.3);
  border-top-color: #fff;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Fade in */
@keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.anim { animation: fadeUp .35s ease both; }

/* Score result */
.result-banner {
  border-radius: 16px; padding: 24px; text-align: center; margin-bottom: 20px;
  border: 1px solid;
}
.result-banner.pass { background: rgba(0,255,148,.06); border-color: rgba(0,255,148,.25); }
.result-banner.fail { background: rgba(255,79,106,.06); border-color: rgba(255,79,106,.2); }
.result-score { font-size: 48px; font-weight: 800; }
.result-banner.pass .result-score { color: var(--green); }
.result-banner.fail .result-score { color: var(--red); }

/* Nav tabs (dashboard) */
.db-tabs { display: flex; gap: 4px; background: rgba(255,255,255,.04); border-radius: 12px; padding: 4px; margin-bottom: 20px; }
.db-tab {
  flex: 1; padding: 10px; border-radius: 9px; border: none;
  background: transparent; color: var(--muted); font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all .2s; font-family: inherit;
}
.db-tab.active { background: var(--accent); color: #fff; box-shadow: 0 2px 10px rgba(108,99,255,.4); }
</style>
</head>
<body>
<div class="page-wrap">
  <div class="logo-row">
    <div class="logo-mark">D</div>
    <div class="logo-name">Dream<span>Teach</span></div>
  </div>
  <div id="app" style="width:100%;max-width:560px"></div>
</div>

<script>
(function () {
  'use strict';

  /* ---- state ---- */
  var S = {
    step: 'login',   // login | register | resume_result | exam | exam_result | waiting | dashboard
    teacher: null,
    teacherId: localStorage.getItem('dt_teacher_id') || null,
    examQuestions: [],
    examAnswers: [],
    examChecked: false,
    examResult: null,
    timerVal: 30, timerEl: null, timerInt: null,
    myLessons: [],
    dashTab: 'publish'
  };

  var API = location.origin;
  var app = document.getElementById('app');

  /* ---- helpers ---- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function mmss(s) { return Math.floor(s/60)+':'+(s%60<10?'0':'')+Math.round(s%60); }

  function post(url, data) {
    return fetch(API + url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    }).then(function(r) { return r.json(); });
  }

  function ago(ts) {
    if (!ts) return '';
    var s = Math.round((Date.now() - ts) / 1000);
    if (s < 60) return 'hozirgina';
    if (s < 3600) return Math.round(s/60) + ' daq oldin';
    if (s < 86400) return Math.round(s/3600) + ' soat oldin';
    return Math.round(s/86400) + ' kun oldin';
  }

  /* ---- steps bar ---- */
  var STEPS = { login:0, register:0, resume_result:1, exam:2, exam_result:3, waiting:3, dashboard:4 };
  var TOTAL_STEPS = 5;
  function stepsHtml(cur) {
    var n = STEPS[cur] || 0;
    var h = '';
    for (var i = 0; i < TOTAL_STEPS; i++) {
      h += '<div class="step-dot' + (i < n ? ' done' : i === n ? ' active' : '') + '"></div>';
    }
    return '<div class="steps">' + h + '</div>';
  }

  /* ============================================================
     SCREENS
  ============================================================ */

  /* --- Login / Resume check screen --- */
  function showLogin() {
    S.step = 'login';
    app.innerHTML = '<div class="panel anim">' +
      stepsHtml('login') +
      '<div class="panel-title">O\'qituvchi sifatida kirish</div>' +
      '<p class="panel-sub">Ro\'yxatdan o\'tgan bo\'lsangiz, ID raqamingizni kiriting. Yangi bo\'lsangiz — ro\'yxatdan o\'ting.</p>' +
      '<div class="f-group"><label class="f-label">O\'qituvchi ID</label><input class="f-input" id="loginId" placeholder="tr-abc123..." autocomplete="off"></div>' +
      '<div class="err-msg" id="loginErr"></div>' +
      '<button class="btn-primary" id="loginBtn" style="margin-bottom:12px"><span>Kirish</span></button>' +
      '<div style="text-align:center;color:var(--muted);font-size:13px">Hali ro\'yxatdan o\'tmadingizmi? <button class="btn-ghost" id="toRegBtn" style="padding:6px 14px;margin-left:6px">Ro\'yxatdan o\'tish</button></div>' +
      '</div>';

    // autofill
    if (S.teacherId) {
      document.getElementById('loginId').value = S.teacherId;
    }

    document.getElementById('loginBtn').onclick = function() { doLogin(); };
    document.getElementById('loginId').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
    document.getElementById('toRegBtn').onclick = function() { showRegister(); };
  }

  function doLogin() {
    var id = document.getElementById('loginId').value.trim();
    var errEl = document.getElementById('loginErr');
    if (!id) { errEl.textContent = 'ID kiriting'; return; }
    errEl.textContent = '';
    var btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span> Tekshirilmoqda…';
    fetch(API + '/api/teacher/status/' + encodeURIComponent(id))
      .then(function(r) { return r.json(); })
      .then(function(j) {
        if (j.error) { errEl.textContent = 'Topilmadi. ID noto\'g\'ri yoki qayta ro\'yxatdan o\'ting.'; btn.disabled=false; btn.innerHTML='<span>Kirish</span>'; return; }
        S.teacher = j; S.teacherId = j.id;
        localStorage.setItem('dt_teacher_id', j.id);
        routeByStatus(j.status);
      })
      .catch(function() { errEl.textContent = 'Server bilan bog\'liq xato. Internet tekshiring.'; btn.disabled=false; btn.innerHTML='<span>Kirish</span>'; });
  }

  function routeByStatus(status) {
    if (status === 'pending_exam') showExamIntro();
    else if (status === 'pending_admin') showWaiting();
    else if (status === 'approved') showDashboard();
    else if (status === 'rejected') showRejected();
    else showLogin();
  }

  /* --- Register --- */
  function showRegister() {
    S.step = 'register';
    app.innerHTML = '<div class="panel anim">' +
      stepsHtml('register') +
      '<div class="panel-title">Ro\'yxatdan o\'tish</div>' +
      '<p class="panel-sub">Ma\'lumotlaringizni kiriting. AI resumeni avtomatik tahlil qiladi.</p>' +
      '<div class="f-row">' +
        '<div class="f-group"><label class="f-label">Ism Familiya</label><input class="f-input" id="regName" placeholder="Aziz Karimov" required></div>' +
        '<div class="f-group"><label class="f-label">Telefon</label><input class="f-input" id="regPhone" placeholder="+998901234567" type="tel"></div>' +
      '</div>' +
      '<div class="f-row">' +
        '<div class="f-group"><label class="f-label">Mutaxassislik</label><input class="f-input" id="regSpec" placeholder="Python dasturlash" required></div>' +
        '<div class="f-group"><label class="f-label">Tajriba (yil)</label><input class="f-input" id="regExp" type="number" min="0" max="50" placeholder="3"></div>' +
      '</div>' +
      '<div class="f-group"><label class="f-label">Resume / Haqingizda</label>' +
        '<textarea class="f-textarea" id="regResume" rows="6" placeholder="Qisqacha o\'zingiz haqingizda yozing: ta\'lim, sertifikatlar, loyihalar, o\'qitgan kurslar..."></textarea></div>' +
      '<div class="err-msg" id="regErr"></div>' +
      '<button class="btn-primary" id="regBtn" style="margin-bottom:12px"><span>✨ AI tahlil qilsin</span></button>' +
      '<div style="text-align:center"><button class="btn-ghost" id="backLoginBtn">← Orqaga</button></div>' +
      '</div>';

    document.getElementById('regBtn').onclick = function() { doRegister(); };

  /* --- Exam screen --- */
  var examTimers = [];
  function showExam() {
    examTimers.forEach(clearInterval);
    examTimers = [];
    S.step = 'exam';
    var qs = S.examQuestions;
    var TOTAL_SECS = 30 * qs.length;

    app.innerHTML =
      '<div class="exam-outer anim">' +
        stepsHtml('exam') +
        '<div class="exam-topbar">' +
          '<div>' +
            '<div style="font-size:18px;font-weight:800;margin-bottom:2px">✏️ Imtihon</div>' +
            '<div class="exam-progress-label" id="examStatus">0 / ' + qs.length + ' ta savol javoblandi</div>' +
          '</div>' +
          '<div class="exam-timer" id="examTimer">⏱ ' + Math.floor(TOTAL_SECS / 60) + ':' + String(TOTAL_SECS % 60).padStart(2,'0') + '</div>' +
        '</div>' +

        '<div class="exam-dots" id="examDots">' +
          qs.map(function(_, i){ return '<div class="exam-dot' + (i===0?' current':'') + '" id="dot'+i+'"></div>'; }).join('') +
        '</div>' +

        '<div class="exam-pbar">' +
          '<div class="exam-pbar-fill" id="examPbarFill" style="width:0%"></div>' +
          '<div class="exam-pbar-time" id="examPbarTime" style="width:100%"></div>' +
        '</div>' +

        '<div class="exam-wrap" id="examWrap">' +
          qs.map(function(q, qi) {
            return '<div class="q-card" id="qcard'+qi+'" style="animation-delay:'+(qi*0.07)+'s">' +
              '<div class="q-num">' + (qi+1) + '-savol</div>' +
              '<div class="q-text">' + esc(q.q) + '</div>' +
              '<div class="q-opts" id="qopts'+qi+'">' +
                q.options.map(function(opt, oi) {
                  return '<button class="q-opt" data-qi="'+qi+'" data-oi="'+oi+'">' +
                    '<span class="opt-key">' + 'ABCD'[oi] + '</span>' +
                    '<span class="opt-label">' + esc(opt) + '</span>' +
                  '</button>';
                }).join('') +
              '</div>' +
            '</div>';
          }).join('') +
        '</div>' +

        '<div class="err-msg" id="examSubmitErr" style="margin-top:4px"></div>' +
        '<button class="btn-primary" id="submitExamBtn" disabled style="margin-top:20px">' +
          '<span>Imtihonni topshirish →</span>' +
        '</button>' +
      '</div>';

    /* Timer */
    var elapsed = 0;
    var timerEl  = document.getElementById('examTimer');
    var pbarTime = document.getElementById('examPbarTime');

    var globalTimer = setInterval(function() {
      elapsed++;
      var left = Math.max(0, TOTAL_SECS - elapsed);
      var mm = Math.floor(left / 60), ss = left % 60;
      timerEl.textContent = '⏱ ' + mm + ':' + String(ss).padStart(2,'0');
      var pct = (elapsed / TOTAL_SECS) * 100;
      pbarTime.style.width = Math.max(0, 100 - pct) + '%';
      if (left <= Math.floor(TOTAL_SECS * 0.2)) timerEl.classList.add('urgent');
      if (left === 0) { clearInterval(globalTimer); submitExam(); }
    }, 1000);
    examTimers.push(globalTimer);

    /* Clicks */
    document.getElementById('examWrap').addEventListener('click', function(e) {
      var btn = e.target.closest('[data-qi]');
      if (!btn) return;
      var qi = +btn.dataset.qi, oi = +btn.dataset.oi;
      S.examAnswers[qi] = oi;

      /* update options */
      var opts = document.getElementById('qopts'+qi).querySelectorAll('.q-opt');
      opts.forEach(function(o, i) { o.classList.toggle('sel', i===oi); });

      /* update dots */
      var dot = document.getElementById('dot'+qi);
      if (dot) { dot.classList.add('answered'); dot.classList.remove('current'); }

      /* progress bar fill */
      var answered = S.examAnswers.filter(function(x){ return x !== undefined; }).length;
      var pbarFill = document.getElementById('examPbarFill');
      if (pbarFill) pbarFill.style.width = (answered / qs.length * 100) + '%';

      /* status text */
      var status = document.getElementById('examStatus');
      if (status) status.textContent = answered + ' / ' + qs.length + ' ta savol javoblandi';

      /* submit button */
      var sb = document.getElementById('submitExamBtn');
      if (sb) sb.disabled = (answered < qs.length);
    });

    document.getElementById('submitExamBtn').onclick = function() { submitExam(); };
  }

  function submitExam() {
    examTimers.forEach(clearInterval); examTimers = [];
    var btn = document.getElementById('submitExamBtn');
    if (btn) { btn.disabled=true; btn.innerHTML='<span class="spin"></span> Baholanmoqda…'; }
    var errEl = document.getElementById('examSubmitErr');

    post('/api/teacher/exam/submit', { teacherId: S.teacherId, answers: S.examAnswers })
      .then(function(j) {
        if (j.error) { if (errEl) errEl.textContent = j.error; if (btn) { btn.disabled=false; btn.innerHTML='<span>Imtihonni topshirish →</span>'; } return; }
        S.examResult = j.result;

      .catch(function() { if (errEl) errEl.textContent = 'Server xatosi.'; if (btn) { btn.disabled=false; btn.innerHTML='<span>Imtihonni topshirish →</span>'; } });
  }

          '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">' +
            '<label class="f-label" style="margin-bottom:0">Transkript (Dars matni va daqiqalari)</label>' +
            '<button type="button" class="chip ok" id="dbAiGenBtn" style="border:none;cursor:pointer;font-size:12px;padding:4px 12px;display:inline-flex;align-items:center;gap:6px">' +
              '<span>✨ AI yozsin</span>' +
            '</button>' +
          '</div>' +
          '<textarea class="f-textarea" id="dbTranscript" rows="6" placeholder="Video tanlang yoki dars nomini yozib «✨ AI yozsin» tugmasini bosing (yoki to\'g\'ridan-to\'g\'ri Nashr qilishni bosing — AI avtomatik to\'ldiradi)"></textarea>' +
          '<div style="font-size:11px;color:var(--muted);margin-top:4px">💡 Transkript kiritmasangiz ham bo\'ladi: Sun\'iy intellekt video va mavzu asosida o\'zi to\'liq yozib chiqadi.</div>' +
        '</div>' +
        '<div class="err-msg" id="dbErr"></div>' +
        '<button class="btn-primary" id="dbPubBtn"><span>📤 Nashr qilish</span></button>' +
        '</div>';

      document.getElementById('dbPubBtn').onclick = function() { publishLesson(); };

      var videoInput = document.getElementById('dbVideo');
      var videoInfo = document.getElementById('dbVideoInfo');
      detectedVideoDuration = 0;

      if (videoInput) {
        videoInput.onchange = function() {
          var file = videoInput.files && videoInput.files[0];
          if (!file) return;
          var titleEl = document.getElementById('dbTitle');
          if (titleEl && !titleEl.value.trim()) {
            var clean = file.name.replace(/\.[^/.]+$/, '').replace(/[_-]+/g, ' ').trim();
            titleEl.value = clean.charAt(0).toUpperCase() + clean.slice(1);
          }
          var tempV = document.createElement('video');
          tempV.preload = 'metadata';
          tempV.src = URL.createObjectURL(file);
          tempV.onloadedmetadata = function() {
            window.URL.revokeObjectURL(tempV.src);
            detectedVideoDuration = Math.round(tempV.duration) || 0;
            if (videoInfo) {
              var mb = (file.size / (1024 * 1024)).toFixed(1);
              videoInfo.style.display = 'block';
              videoInfo.innerHTML = '📹 <b>' + esc(file.name) + '</b> · ' + mmss(detectedVideoDuration) + ' · ' + mb + ' MB';
            }
          };
        };
      }

      var aiGenBtn = document.getElementById('dbAiGenBtn');
      if (aiGenBtn) {
        aiGenBtn.onclick = function() {
          var title = (document.getElementById('dbTitle')||{}).value || '';
          var course = (document.getElementById('dbCourse')||{}).value || '';
          var errEl = document.getElementById('dbErr');
          if (!title.trim()) {
            if (errEl) { errEl.style.color = 'var(--red)'; errEl.textContent = 'Avval dars nomini kiriting yoki video tanlang'; }
            return;
          }
          aiGenBtn.disabled = true;
          aiGenBtn.innerHTML = '<span class="spin"></span> 🤖 AI yozmoqda…';
          if (errEl) { errEl.style.color = 'var(--accent2)'; errEl.textContent = '🤖 Sun\'iy intellekt video mavzusi bo\'yicha transkript tuzmoqda…'; }

          post('/api/ai/transcript', {
            title: title.trim(),
            courseTitle: course.trim(),
            specialty: S.teacher && S.teacher.specialty,
            duration: detectedVideoDuration || 180
          }).then(function(res) {
            aiGenBtn.disabled = false;
            aiGenBtn.innerHTML = '<span>✨ AI yozsin</span>';
            if (res.ok && res.text) {
              var txEl = document.getElementById('dbTranscript');
              if (txEl) txEl.value = res.text;
              if (errEl) { errEl.style.color = 'var(--green)'; errEl.textContent = '✅ Transkript AI tomonidan tayyorlandi! Kerak bo\'lsa tahrirlashingiz mumkin.'; }
            } else {
              if (errEl) { errEl.style.color = 'var(--red)'; errEl.textContent = res.error || 'AI transkript tuzishda xatolik'; }
            }
          }).catch(function() {
            aiGenBtn.disabled = false;
            aiGenBtn.innerHTML = '<span>✨ AI yozsin</span>';
            if (errEl) { errEl.style.color = 'var(--red)'; errEl.textContent = 'Server bilan bog\'lanishda xato'; }
          });
        };
      }
    } else {
      var lessons = S.myLessons;
      if (!lessons.length) {
        el.innerHTML = '<div style="text-align:center;padding:32px;color:var(--muted)"><div style="font-size:36px;margin-bottom:12px">📚</div><p>Hali dars yuklamadingiz.<br>«Dars yuklash» bo\'limidan boshlang.</p></div>';
      } else {
        el.innerHTML = '<div style="display:flex;flex-direction:column;gap:10px">' +
          lessons.map(function(l) {
            return '<div class="lesson-card">' +
              '<div class="l-info"><div class="nm">'+esc(l.title)+'</div><div class="meta">'+esc(l.courseTitle||'')+(l.duration?' · '+mmss(l.duration):'')+'</div></div>' +
              '<div style="display:flex;align-items:center;gap:8px">' +
                '<span class="chip '+(l.status==='uploaded'?'ok':'warn')+'">'+(l.status==='uploaded'?'Serverda':'Mahalliy')+'</span>' +
              '</div>' +
            '</div>';
          }).join('') +
        '</div>';
      }
    }
  }

  async function publishLesson() {
    if (!S.subscription || !S.subscription.active) {
      if (confirm("Kurs va darslarni joylashtirish uchun o'qituvchi obunasi faol bo'lishi kerak.\n\nObuna sotib olish sahifasiga o'tasizmi?")) {
        location.href = '/payment?userId=' + encodeURIComponent(S.teacherId) + '&userType=teacher';
      }
      return;
    }
    var title = (document.getElementById('dbTitle')||{}).value || '';
    var courseTitle = (document.getElementById('dbCourse')||{}).value || '';
    var price = +(document.getElementById('dbPrice')||{}).value || 0;
    var transcript = (document.getElementById('dbTranscript')||{}).value || '';
    var videoInput = document.getElementById('dbVideo');
    var errEl = document.getElementById('dbErr');
    if (!title.trim()) { if (errEl) { errEl.style.color='var(--red)'; errEl.textContent = 'Dars nomini kiriting yoki video tanlang'; } return; }

    var btn = document.getElementById('dbPubBtn');
    btn.disabled = true;

    // AI AUTO-TRANSCRIPT: If transcript is empty, generate it automatically
    if (!transcript.trim()) {
      btn.innerHTML = '<span class="spin"></span> 🤖 AI transkript tuzmoqda…';
      if (errEl) { errEl.style.color = 'var(--accent2)'; errEl.textContent = '🤖 Transkript kiritilmagan — AI uni avtomatik tuzmoqda…'; }
      try {
        var aiRes = await post('/api/ai/transcript', {
          title: title.trim(),
          courseTitle: courseTitle.trim(),
          specialty: S.teacher && S.teacher.specialty,
          duration: detectedVideoDuration || 180
        });
        if (aiRes && aiRes.text) {
          transcript = aiRes.text;
          var txEl = document.getElementById('dbTranscript');
          if (txEl) txEl.value = transcript;
        }
      } catch (e) {
        transcript = '00:00 ' + title.trim();
      }
    }

    if (errEl) { errEl.style.color='var(--accent2)'; errEl.textContent = 'Dars nashr qilinmoqda…'; }
    btn.innerHTML='<span class="spin"></span> Yuklanmoqda…';

    // Parse transcript
    var segs = [];
    transcript.split('\n').forEach(function(line) {
      var m = line.match(/^\[?(?:(\d+):)?(\d{1,2}):(\d{2})\]?\s*(.*)/);
      if (m) {
        var sec = +m[2]*60 + +m[3];
        segs.push({ t: sec, text: m[4].trim() });
      }
    });
    if (!segs.length) {
      var paras = transcript.split('\n\n').filter(Boolean);
      segs = paras.map(function(p, i){ return { t: i*15, text: p.trim() }; });
    }
    if (!segs.length) {
      segs = [{ t: 0, text: title.trim() }];
    }

    var lessonId = 'tr-l-' + Date.now().toString(36);
    var lesson = {
      id: lessonId, title: title.trim(),
      courseTitle: courseTitle.trim() || (S.teacher&&S.teacher.specialty)||'Umumiy',
      courseId: 'tr-c-' + ((S.teacher&&S.teacher.id)||'x'),
      author: (S.teacher&&S.teacher.name)||'O\'qituvchi',
      segments: segs,
      duration: detectedVideoDuration || (segs.length ? segs[segs.length-1].t + 15 : 60),
      price: price, status: 'local', createdAt: Date.now()
    };

    var file = videoInput && videoInput.files && videoInput.files[0];

    function finish(videoUrl) {
      if (videoUrl) lesson.video = videoUrl;
      post('/api/sync', {
        device: { id: S.teacherId, name: S.teacher&&S.teacher.name||'Teacher' },
        events: [{ id: 'e-'+lessonId, type: 'lesson_published', ts: Date.now(), data: lesson }]
      }).then(function() {
        lesson.status = 'uploaded';
        S.myLessons.unshift(lesson);
        btn.disabled=false; btn.innerHTML='<span>📤 Nashr qilish</span>';
        if (errEl) { errEl.style.color='var(--green)'; errEl.textContent='✅ Dars muvaffaqiyatli nashr qilindi!'; }
        setTimeout(function(){ S.dashTab='lessons'; showDashboard(); }, 1200);
      }).catch(function() {
        S.myLessons.unshift(lesson);
        btn.disabled=false; btn.innerHTML='<span>📤 Nashr qilish</span>';
        if (errEl) { errEl.style.color='var(--green)'; errEl.textContent='✅ Mahalliy saqlandi. Internet qaytganda yuboriladi.'; }
      });
    }

    if (file) {
      fetch(API + '/api/upload?id=' + lessonId, {
        method: 'POST', headers: { 'Content-Type': file.type }, body: file
      }).then(function(r){ return r.json(); }).then(function(j){ finish(j.url); }).catch(function(){ finish(null); });
    } else {
      finish(null);
    }
  }

  function doLogout() {
    S.teacher = null; S.teacherId = null;
    localStorage.removeItem('dt_teacher_id');
    showLogin();
  }

  /* --- Boot --- */
  function boot() {
    if (S.teacherId) {
      // Try to load status
      fetch(API + '/api/teacher/status/' + S.teacherId)
        .then(function(r){ return r.json(); })
        .then(function(j){
          if (j.id) {
            S.teacher = j;
            // Also load subscription status
            return fetch(API + '/api/subscription/status?userId=' + S.teacherId + '&userType=teacher')
              .then(function(r){ return r.json(); })
              .then(function(sub){ S.subscription = sub; })
              .catch(function(){})
              .then(function(){ routeByStatus(j.status); });
          } else {
            showLogin();
          }
        })
        .catch(function(){ showLogin(); });
    } else {
      showLogin();
    }
  }
  boot();
})();
</script>
